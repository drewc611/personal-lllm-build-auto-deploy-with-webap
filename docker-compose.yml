services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      # Required, no default: cp .env.example .env and set a generated value.
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env (see .env.example)}
      - RUN_API_TOKEN=${RUN_API_TOKEN:?set RUN_API_TOKEN in .env (see .env.example)}
      # The container must listen on all interfaces for the port mapping to work.
      - FLASK_HOST=0.0.0.0
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      # Host loopback only; the app reaches Ollama over the compose network.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/data
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
